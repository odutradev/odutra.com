    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme ? savedTheme === 'dark' : systemPrefersDark;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
        font-family: 'Inter', sans-serif;
      }

      html, body, header, footer, section, div, button, a, span, p, h1, h2, h3, h4, h5, h6, input, textarea {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      }

      .bg-grid-pattern {
        background-image: 
          linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      .ghost-border {
        border: 1px solid var(--color-slate-700);
      }

      .hover-ghost-border:hover {
        border-color: var(--color-electric-blue);
      }
